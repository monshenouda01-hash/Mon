    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // ===== Typed Effect =====
        const phrases = [
          "Web Developer",
          "UI/UX Specialist.",
          "Problem Solver.",
          "Product builder",
        ];
        const typedEl = document.getElementById("typed");
        let phraseIndex = 0,
          charIndex = 0,
          deleting = false;

        function typeEffect() {
          if (!typedEl) return;
          const current = phrases[phraseIndex];
          if (!deleting) {
            typedEl.textContent = current.slice(0, ++charIndex);
            if (charIndex === current.length) {
              deleting = true;
              setTimeout(typeEffect, 1200);
              return;
            }
          } else {
            typedEl.textContent = current.slice(0, --charIndex);
            if (charIndex === 0) {
              deleting = false;
              phraseIndex = (phraseIndex + 1) % phrases.length;
            }
          }
          setTimeout(typeEffect, deleting ? 60 : 90);
        }
        typeEffect();

        // ===== AOS Initialization =====
        AOS.init({ duration: 1000, once: true });

        // ===== القائمة (موبايل) =====
        const toggleBtn = document.querySelector(".menu-toggle");
        const hintBubble = document.querySelector(".menu-hint-bubble");

        // إظهار رسالة "more / pages" بعد 10 ثواني من دخول الموقع
        let hintHideTimeout;
        const hintTimeout = setTimeout(() => {
          if (toggleBtn && !toggleBtn.classList.contains("active")) {
            hintBubble?.classList.add("show");
            hintHideTimeout = setTimeout(() => {
              hintBubble?.classList.remove("show");
            }, 6000);
          }
        }, 10000);

        toggleBtn?.addEventListener("click", () => {
          hintBubble?.classList.remove("show");
          clearTimeout(hintTimeout);
          clearTimeout(hintHideTimeout);
        });

        // ===== زر تغيير الثيم =====
        const themeBtn = document.querySelector(".theme-toggle");
        themeBtn.addEventListener("click", () => {
          document.body.classList.toggle("light");
        });
      });
    </script>
